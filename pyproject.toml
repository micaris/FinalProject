[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pricing-lib"
version = "0.1.0"
description = "Quadratic rough Heston calibration and portfolio optimisation library"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "cvxpy",
]

[tool.setuptools]
# Ship only pricing_lib; do not auto-discover the thesis/data directories.
packages = ["pricing_lib"]

[tool.setuptools.package-data]
pricing_lib = ["*.md"]
